name: Lytro
description: >-
  Lytro was a light-field (plenoptic) imaging company founded in 2006 by Ren Ng
  and based in Mountain View, California. It shipped the first consumer
  light-field cameras (the Lytro and the Lytro Illum), which captured the entire
  light field so images could be refocused after the fact, and later pivoted to
  professional light-field capture for cinema and VR with Lytro Cinema and Lytro
  Immerge. Backed by a16z, Greylock, NEA and Qualcomm Ventures, the company wound
  down in March 2018 with much of its technology and talent moving to Google. It
  is defunct and publishes no public developer program or API; the lytro.com
  domain now 301-redirects to an unrelated light-field vendor (raytrix.de).
